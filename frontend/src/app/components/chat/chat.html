<div class="mt-6 border-t pt-4">
  <h4 class="font-bold text-[#9B1C1F] mb-3">Chat</h4>

  <div class="bg-gray-50 border border-gray-200 rounded-xl p-3 h-56 overflow-y-auto space-y-2">
    @if (messages().length === 0) {
      <p class="text-sm text-gray-400">No messages yet.</p>
    } @else {
      @for (m of messages(); track m.id) {
        <div class="text-sm">
          <span class="text-gray-500 text-xs mr-2">{{ m.createdAt | date:'shortTime' }}</span>
          <span class="font-semibold text-gray-700 mr-2">
            {{ myUserId !== null && m.senderId === myUserId ? 'You:' : 'Other:' }}
          </span>
          <span class="text-gray-800">{{ m.text }}</span>
        </div>
      }
    }
  </div>

  <div class="mt-3 flex gap-2">
    <input
      [(ngModel)]="draft"
      (keyup.enter)="send()"
      class="flex-1 border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#9B1C1F]/40"
      placeholder="Type a message..."
    />
    <button
      (click)="send()"
      class="bg-[#9B1C1F] text-white px-4 py-2 rounded-xl text-sm font-bold hover:opacity-90 transition"
    >
      Send
    </button>
  </div>
</div>
