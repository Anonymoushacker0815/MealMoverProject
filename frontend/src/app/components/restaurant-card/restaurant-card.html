<div class="
  group
  relative
  w-full
  h-44
  bg-white
  rounded-[2.5rem]
  overflow-hidden
  flex
  cursor-pointer
  transition-all duration-200
  ring-2 ring-[#9B1C1F]
  hover:ring-4
"
     (click)="openMenu()"
>

  <div class="flex-1 p-8 flex flex-col justify-center z-10">

    <h3 class="text-3xl font-bold text-[#9B1C1F] uppercase tracking-wide leading-tight group-hover: decoration-[#9B1C1F]  line-clamp-1">
      {{ restaurant.name }}
    </h3>

    <div class="flex items-center gap-4 mt-3 text-sm font-bold text-[#9B1C1F]">
      <div class="flex items-center gap-1">
        <span>★</span>
        <span>{{ restaurant.average_rating }}</span>
        <span class="text-gray-400 font-normal">({{ restaurant.review_count }})</span>
      </div>

      <span class="text-gray-300">|</span>

      <span class="text-gray-400 uppercase tracking-wider text-xs">
        {{ restaurant.delivery_zone || 'base' }} KM
      </span>
    </div>
  </div>

  <div class="w-1/3 min-w-[160px] relative overflow-hidden h-full">

    <div class="absolute inset-0 bg-gray-50 transform -skew-x-12 scale-125 origin-bottom-right border-l-4 border-white transition-colors flex items-center justify-center">

    </div>
  </div>
</div>
