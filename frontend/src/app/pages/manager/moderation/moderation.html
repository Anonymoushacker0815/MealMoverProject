<app-navbar role="manager"></app-navbar>
<div class="min-h-screen bg-gray-100">
  <div class="max-w-5xl mx-auto px-4 py-6 space-y-4">

    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-semibold">Moderation</h1>

      <button
        type="button"
        (click)="loadOpenReports()"
        class="px-3 py-1.5 border rounded bg-white text-sm hover:bg-gray-50"
      >
        Refresh
      </button>
    </div>

    <div *ngIf="errorMsg" class="bg-red-50 border border-red-200 text-red-700 rounded p-3">
      {{ errorMsg }}
    </div>

    <div *ngIf="isLoading" class="bg-white border rounded p-4 text-gray-600">
      Loading reports...
    </div>

    <div *ngIf="!isLoading && reports.length === 0" class="bg-white border rounded p-4 text-gray-600">
      No open reports 🎉
    </div>

    <div *ngIf="!isLoading && reports.length > 0" class="space-y-3">
      <div
        *ngFor="let r of reports"
        class="bg-white border rounded p-4"
      >
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <h2 class="text-lg font-semibold truncate">
              {{ r.thread_title || ('Thread #' + r.thread_id) }}
            </h2>

            <div class="mt-1 text-sm text-gray-500 flex flex-wrap gap-x-2 gap-y-1">
              <span>Thread ID: {{ r.thread_id }}</span>
              <span>•</span>
              <span>Reported by User ID: {{ r.reporter_id }}</span>
              <span *ngIf="r.thread_author_name">
                • Thread author: {{ r.thread_author_name }}
              </span>
              <span>•</span>
              <span>{{ r.created_at | date:'medium' }}</span>
            </div>

            <div class="mt-3 text-sm text-gray-800 whitespace-pre-wrap">
              <span class="font-medium">Reason:</span>
              {{ r.reason || '—' }}
            </div>
          </div>

          <div class="flex flex-col gap-2 shrink-0">
            <button
              type="button"
              (click)="dismiss(r)"
              class="px-3 py-1.5 border rounded bg-white text-sm hover:bg-gray-50"
            >
              Dismiss
            </button>

            <button
              type="button"
              (click)="action(r)"
              class="px-3 py-1.5 bg-[#9B1C1F] text-white rounded text-sm hover:opacity-90"
            >
              Actioned
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
