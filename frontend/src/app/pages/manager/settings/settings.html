<app-navbar role="manager"></app-navbar>
<main class="p-6">
    <h1>settings works!</h1>
    <div *ngIf="isLoading">
        Loading Settings ...
    </div>
    <div *ngIf="errorMsg">
        {{errorMsg}}
    </div>
    <div>
        <h1>settings:</h1>
        <ul>
            <li *ngFor="let item of settings">
                {{item.delivery_distance}}, {{ item.discount}}, {{item.service_fee}}
            </li>
        </ul>
        <p>{{settings}}</p>
    </div>
</main>
