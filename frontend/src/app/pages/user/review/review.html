<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-2xl shadow-lg border border-gray-100 fade-in-up">

  <!-- Header  -->
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold text-[#9B1C1F]">Order Delivered!</h2>
    <p class="text-gray-500 mt-2">Leave a review?</p>
  </div>

  <div class="space-y-6">
    <!-- Stars -->
    <div class="flex justify-center gap-2 group">
      @for (star of [1, 2, 3, 4, 5]; track star) {
        <button
          (click)="setRating(star)"
          class="focus:outline-none transition-all duration-200 hover:scale-110"
          [ngClass]="{
            'text-[#9B1C1F] drop-shadow-sm': rating >= star,
            'text-gray-200 hover:text-red-300': rating < star
          }">
          <!-- Copied from Heroicons.com -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" viewBox="0 0 20 20" fill="currentColor">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
          </svg>
        </button>
      }
    </div>

    <!-- Details -->
    <div>
      <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Comments (Optional)</label>
      <textarea
        [(ngModel)]="details"
        rows="4"
        class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-[#9B1C1F] focus:border-transparent outline-none resize-none transition-colors text-gray-700 placeholder-gray-400"
        placeholder="Tell us what you liked..."></textarea>
    </div>

    <!-- Actions -->
    <div class="pt-2 space-y-3">
      <button
        (click)="submit()"
        [disabled]="rating === 0 || isSubmitting"
        class="w-full bg-[#9B1C1F] text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-[#7a1518] hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all transform active:scale-[0.98]">
        @if (isSubmitting) {
          <span class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Submitting
          </span>
        } @else {
          Submit Review
        }
      </button>

      <button (click)="skip()" class="w-full py-2 text-gray-400 hover:text-gray-600 text-sm font-medium transition-colors">
        Skip Review
      </button>
    </div>

  </div>
</div>
