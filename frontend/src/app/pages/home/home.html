<main class="relative w-full h-screen overflow-hidden">
  <!-- Background -->
  <div
    class="absolute inset-0 bg-no-repeat bg-left-top bg-cover"
    style="background-image: url('/home.png');"
    aria-hidden="true"
  ></div>

  <!-- Text block -->
  <div class="absolute top-10 left-0 p-10 sm:p-14 md:p-20">
    <!-- readability layer (only under the left area) -->
    <div>
      <h1
        class="font-extrabold tracking-tight text-white drop-shadow
               leading-[0.92]
               text-[clamp(4rem,7vw,9rem)]
               max-w-[18ch]
               whitespace-normal lg:whitespace-nowrap"
      >
        Feed the Hunger
      </h1>
    </div>
  </div>
</main>
