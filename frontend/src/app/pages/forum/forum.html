<!-- Forum Page Wrapper -->
<div class="min-h-screen bg-gray-100">

  <!-- Filter Bar -->
  <div
    class="
      sticky top-[64px] z-40
      bg-white border-b
      px-4 py-3
      flex flex-wrap gap-2 items-center
    "
  >
    <!-- New Thread -->
    <ng-container *ngIf="isLoggedIn()">
      <button
          (click)="goNewThread()"  
          class="
              ml-auto
              bg-[#9B1C1F] text-white
              px-4 py-1.5 rounded
              text-sm font-medium
              hover:opacity-90
              transition
          "
      >
        + New Thread
      </button>
    </ng-container>
  </div>

  <!-- Thread List -->
  <div class="max-w-4xl mx-auto px-4 py-6">

    <div class="max-w-4xl mx-auto px-4 py-6">
        <div class="max-w-4xl mx-auto px-4 py-6 space-y-4">
            <app-thread-card
                *ngFor="let thread of threads"
                [thread]="thread"
                (open)="goThread($event)"
                (like)="onLike($event)"
                (dislike)="onDislike($event)"
                (report)="onReport($event)"
            ></app-thread-card>
            </div>
    </div>

    <!-- Empty State -->
    <div
      *ngIf="threads.length === 0"
      class="text-center text-gray-500 mt-12"
    >
      No threads found.
    </div>

  </div>
  <!-- Report Modal -->
  <div *ngIf="isReportModalOpen" class="fixed inset-0 z-50">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/40" (click)="cancelReport()"></div>

    <!-- Dialog -->
    <div class="relative min-h-full flex items-center justify-center p-4">
      <div class="w-full max-w-lg bg-white rounded-lg shadow-lg border">
        <div class="px-5 py-4 border-b flex items-center justify-between">
          <h2 class="text-lg font-semibold">
            Report thread
          </h2>
          <button
            type="button"
            (click)="cancelReport()"
            class="px-2 py-1 text-sm text-gray-600 hover:text-gray-900"
            aria-label="Close"
          >
            ✕
          </button>
        </div>

        <div class="px-5 py-4 space-y-3">
          <div class="text-sm text-gray-600">
            <div class="font-medium text-gray-900 truncate">
              {{ reportTarget?.title }}
            </div>
            <div class="mt-1">
              Thread ID: {{ reportTarget?.id }}
            </div>
          </div>

          <label class="block text-sm font-medium text-gray-700">
            Reason
          </label>

          <select
            class="w-full border rounded px-3 py-2 text-sm bg-white"
            [(ngModel)]="reportReasonPreset"
          >
            <option value="Spam / off-topic">Spam / off-topic</option>
            <option value="Harassment / inappropriate language">Harassment / inappropriate language</option>
            <option value="Other">Other</option>
          </select>

          <div *ngIf="reportReasonPreset === 'Other'">
            <label class="block text-sm font-medium text-gray-700 mt-2">
              Details
            </label>
            <textarea
              class="w-full border rounded px-3 py-2 text-sm"
              rows="3"
              [(ngModel)]="reportReasonOther"
              placeholder="Describe the issue..."
            ></textarea>
          </div>

          <div *ngIf="reportErrorMsg" class="text-sm text-red-700 bg-red-50 border border-red-200 rounded p-2">
            {{ reportErrorMsg }}
          </div>
        </div>

        <div class="px-5 py-4 border-t flex justify-end gap-2">
          <button
            type="button"
            (click)="cancelReport()"
            class="px-3 py-1.5 border rounded bg-white text-sm hover:bg-gray-50"
            [disabled]="isSubmittingReport"
          >
            Cancel
          </button>

          <button
            type="button"
            (click)="submitReport()"
            class="px-3 py-1.5 bg-[#9B1C1F] text-white rounded text-sm hover:opacity-90 disabled:opacity-60"
            [disabled]="isSubmittingReport"
          >
            {{ isSubmittingReport ? 'Submitting…' : 'Submit report' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
